services:
  - type: web
    name: wisorbit-video-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "7860"
      # set these in the Render dashboard (never commit values)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GOOGLE_AUTH_ENABLED
        sync: false
      # 1 = this web service also renders (one at a time). Set 0 once Oracle workers run.
      - key: WORKER_IN_WEB
        value: "1"
